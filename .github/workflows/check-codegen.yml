name: Check Codegen

on:
  pull_request:

jobs:
  check-codegen:
    name: Run code generation checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Run code gen checks
      run: make check-gen
