apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabriclet
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fabriclet-role
rules:
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells
  - nodes
  - interfaces
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells/status
  - nodes/status
  - interfaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells/finalizers
  - nodes/finalizers
  verbs:
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fabriclet-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fabriclet-role
subjects:
- kind: ServiceAccount
  name: fabriclet
  namespace: default
