---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells/finalizers
  verbs:
  - patch
  - update
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - cells/status
  - interfaces/status
  - nodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - fabric.ironcore.dev
  resources:
  - interfaces
  - nodes
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
