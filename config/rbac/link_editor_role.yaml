# This rule is not used by the project wire itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the wire.ironcore.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: wire
    app.kubernetes.io/managed-by: kustomize
  name: link-editor-role
rules:
- apiGroups:
  - wire.ironcore.dev
  resources:
  - links
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - wire.ironcore.dev
  resources:
  - links/status
  verbs:
  - get
