apiVersion: fabric.ironcore.dev/v1alpha1
kind: CellConfigRollout
metadata:
  labels:
    app.kubernetes.io/name: fabric
    app.kubernetes.io/managed-by: kustomize
    kind: spine
  name: my-cell-rollout
spec:
  configSelector:
    matchLabels:
      kind: spine
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
